name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - run: go vet ./...

      # As plataformas da release.
      - name: build
        run: |
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null . || exit 1
          done

      - name: skill e manifestos do plugin
        run: |
          go build -o pgb .
          ./pgb --skill | diff - skills/pgb/SKILL.md
          jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Alpine (BusyBox) e Debian (GNU): os scripts de shell dentro dos containers rodam nas duas.
        image: [postgres:17-alpine, postgres:18]
    env:
      PGB_TEST_DOCKER: 1 # sem Docker é falha, não teste pulado
      PGB_TEST_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: docker pull -q ${{ matrix.image }}
      - run: go test -count=1 -timeout 10m ./...

  # O binário no macOS fala com um Docker numa VM Linux (aqui o colima): muda como o pg_dump chega
  # numa origem no localhost (host.docker.internal). Os runners Apple Silicon do GitHub não têm
  # virtualização aninhada, então o Docker só sobe no Intel. Leva ~14 min: só no push para o master.
  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-15-intel
    env:
      PGB_TEST_DOCKER: 1
      PGB_TEST_IMAGE: postgres:17-alpine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: docker (colima)
        run: |
          brew install -q colima docker
          colima start --cpu 3 --memory 6
          docker info --format '{{.OperatingSystem}}'
      - run: docker pull -q $PGB_TEST_IMAGE
      - run: go test -count=1 -timeout 15m ./...

  # Apple Silicon: sem Docker, só os testes de unidade.
  unit-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -count=1 -short ./...
